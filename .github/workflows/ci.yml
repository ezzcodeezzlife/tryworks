name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check src tests scripts

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  zero-dependencies:
    name: base install has no dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into an empty virtual environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet .
      - name: Verify nothing else was installed and partitioning works
        run: |
          /tmp/clean/bin/python - <<'EOF'
          import importlib.metadata as md
          installed = sorted(d.metadata["Name"].lower() for d in md.distributions())
          extra = [n for n in installed if n not in {"tryworks", "pip", "setuptools"}]
          assert not extra, f"unexpected packages installed: {extra}"
          from tryworks.partition.html import partition_html
          from tryworks.chunking.title import chunk_by_title
          elements = partition_html(text="<h1>Title</h1><p>The body text explains the title.</p>")
          assert [e.category for e in elements] == ["Title", "NarrativeText"]
          print("ok:", installed, len(chunk_by_title(elements)))
          EOF
